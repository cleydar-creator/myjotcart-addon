name: MyJotCart
version: "0.6.1"
slug: myjotcart
description: Shared shopping lists and home pantry, with barcode scanner (EN, ES, DE, FR, PT)
url: https://github.com/cleydar-creator/myjotcart-addon
arch:
  - amd64
  - aarch64
image: ghcr.io/cleydar-creator/myjotcart
startup: application
boot: auto
ingress: true
ingress_port: 8210
panel_icon: mdi:cart-outline
panel_title: MyJotCart
panel_admin: false
hassio_api: true
discovery:
  - myjotcart
ports:
  8210/tcp: 8210
ports_description:
  8210/tcp: "Direct access from phones and the ESP32 scanner (leave empty to disable)"
